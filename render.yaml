services:
  - type: web
    name: creo-marketplace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/render_start.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: creo-database
          property: connectionString
      - key: DATABASE_MEDIA
        value: 'True'
      - key: SEED_DEMO
        value: 'True'
      # Render exposes this service through its managed HTTPS ingress.
      - key: TRUSTED_PROXY_IP
        value: '*'
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: 'False'
databases:
  - name: creo-database
    plan: free
    databaseName: creo
    user: creo
