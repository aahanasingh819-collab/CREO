<article class="work-card"><a href="{{ item.get_absolute_url }}" class="work-image">{% if item.image %}<img src="{{ item.image.url }}" alt="{{ item.title }}" loading="lazy">{% else %}<span class="video-placeholder">▷<small>Watch project</small></span>{% endif %}<span class="card-label">{% if item.is_demo %}DEMO ARTWORK{% else %}{{ item.get_format_display }}{% endif %}</span><span class="card-arrow">↗</span></a><div class="work-caption"><div><h3><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></h3><p>{{ item.style }} · {{ item.aspect_ratio }}</p></div><span class="muted">{{ item.get_format_display }}</span></div>{% if managing %}<div class="work-actions"><a href="{% url 'portfolio_edit' item.pk %}">Edit project ↗</a><a href="{% url 'portfolio_delete' item.pk %}">Remove</a></div>{% endif %}</article>
